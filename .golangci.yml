version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
    - gocyclo
    - nakedret
    - bodyclose
    - noctx
    - contextcheck
    - containedctx
    - fatcontext
    - depguard
    - forbidigo
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
          severity: warning
    depguard:
      rules:
        production:
          files:
            - '$all'
            - '!**/*_test.go'
          deny:
            - pkg: log
              desc: use the telemetry contract logger
            - pkg: go.opentelemetry.io/otel/sdk
              desc: SDK is test-harness-only
        no-prometheus:
          files:
            - '$all'
            - '!**/*_test.go'
            - '!**/database/metrics.go'
          deny:
            - pkg: github.com/prometheus/client_golang
              desc: legacy Prometheus is allowed only in metrics.go
    forbidigo:
      forbid:
        - pattern: 'slog.Debug'
        - pattern: 'slog.Info'
        - pattern: 'slog.Warn'
        - pattern: 'slog.Error'
        - pattern: 'slog.Default'
        - pattern: 'otel.Tracer'
        - pattern: 'otel.Meter'
        - pattern: 'otel.GetMeterProvider'
        - pattern: 'otel.GetTracerProvider'
        - pattern: 'otel.GetTextMapPropagator'
  exclusions:
    paths:
      - "_test\\.go$"
      - "^_examples/"
      - "^example/"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
