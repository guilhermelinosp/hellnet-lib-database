name: integration

# Runs the real-PostgreSQL integration tests (build tag `integration`) so they
# are exercised in CI and contribute coverage, not just the local unit suite.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HELLNET_TEST_PG_HOST: localhost
      HELLNET_TEST_PG_PORT: "5432"
      HELLNET_TEST_PG_USER: postgres
      HELLNET_TEST_PG_PASSWORD: postgres
      HELLNET_TEST_PG_NAME: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test -tags integration -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage.out
